summary:
  - >-
    Multiplatform infrastructure engineer with more than twenty years across
    DevOps, SRE, and systems administration, specialising in Kubernetes and
    Linux/*BSD environments and equally comfortable in Windows. Extensive
    production experience with Google Cloud Platform and Amazon Web Services,
    more recently joined by the Cloudflare developer platform (Workers, D1).
    Strong Kubernetes administration and troubleshooting background, including
    initial buildouts and value-adds such as the Linkerd service mesh and
    Prometheus monitoring.
  - >-
    A great believer in automation over repetitive busywork — freeing
    engineering time for harder problems and minimising the scope for human
    error — with current tooling centred on infrastructure-as-code (Terraform,
    Pulumi), GitOps, and OpenTelemetry-based observability.
  - >-
    Experienced in running and managing a team: evaluating, hiring, and
    upskilling engineers; sprint-based task prioritisation; and balancing
    business-as-usual break/fix work against larger-scope project work. Most
    recently led infrastructure at Feeld for four years as Head of
    Infrastructure.
  - >-
    Programs in Go, Python, Ruby, JavaScript/TypeScript, and shell (a Fish
    enthusiast); intermediate Java; writes Rust for current CLI tooling.
    Lifelong special interest in information security — penetration testing,
    platform hardening, DFIR, and IoT security — alongside non-professional
    electronic engineering and making. A lateral and quick thinker when things
    inevitably go sideways.

